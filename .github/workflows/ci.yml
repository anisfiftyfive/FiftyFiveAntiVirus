name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Validate AI config
        run: |
          python3 -m json.tool .cursor/hooks.json >/dev/null
          test -s AGENTS.md
          grep -q 'testDebugUnitTest' AGENTS.md
          grep -q 'lintDebug' AGENTS.md
          grep -q 'connectedDebugAndroidTest' AGENTS.md
          test -s .github/CODEOWNERS
          test -s .cursor/permissions.md

      - name: Secret scan
        run: python3 .githooks/scan-tracked.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --quiet --no-daemon

      - name: Android lint
        run: ./gradlew lintDebug --quiet --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --quiet --no-daemon

      - name: Assemble instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --quiet --no-daemon

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose Espresso smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon
