[versions]
agp = "8.9.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
room = "2.6.1"
junit = "4.13.2"
json = "20240303"
okhttp = "5.5.1"
guava = "33.4.8-android"
bouncycastle = "1.81"
lottie = "6.6.6"
